    <style>

        background: #000;

        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F5F6F8;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-nobody-manages", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 4.3);
        tl.fromTo("#el-02-management-layer", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 4.3);

        tl.fromTo("#el-03-assign-work", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 10.3);
        tl.to("#el-03-assign-work", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 17.5);
        tl.fromTo("#el-04-no-silent-failure", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 17.5);
        tl.to("#el-04-no-silent-failure", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 26.8);
        tl.fromTo("#el-05-skills-compound", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 26.8);
        tl.to("#el-05-skills-compound", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 36.3);
        tl.fromTo("#el-06-control-plane", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 36.3);
        tl.to("#el-06-control-plane", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 43);
        tl.fromTo("#el-07-trust-by-design", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 43);
        tl.to("#el-07-trust-by-design", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 49.5);
        tl.fromTo("#el-08-hire-first-agent", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 49.5);
