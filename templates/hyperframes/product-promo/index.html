<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>AI-Remotion Product Promo Template</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05070d; }
      body { color: #f7f8fb; font-family: Inter, sans-serif; }
      #product-promo-root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      [data-composition-src] { position: absolute; inset: 0; }
      .caption {
        position: absolute;
        left: 260px;
        right: 260px;
        bottom: 58px;
        z-index: 20;
        min-height: 76px;
        display: grid;
        place-items: center;
        padding: 14px 28px;
        border: 1px solid rgba(134, 221, 255, 0.38);
        border-radius: 18px;
        background: rgba(5, 9, 18, 0.86);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
        font-size: 30px;
        font-weight: 700;
        text-align: center;
      }
      .progress-shell { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; height: 5px; background: #151b29; }
      #promo-progress { width: 0; height: 100%; background: linear-gradient(90deg, #7c5cff, #39d9c5); }
    </style>
  </head>
  <body>
    <main
      id="product-promo-root"
      data-composition-id="product-promo-template"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="12"
    >
      <div
        id="el-promo-problem"
        data-composition-id="promo-problem"
        data-composition-src="compositions/promo-problem.html"
        data-start="0"
        data-duration="4.2"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
        data-layout-allow-overlap
      ></div>
      <div
        id="el-promo-feature"
        data-composition-id="promo-feature"
        data-composition-src="compositions/promo-feature.html"
        data-start="3.8"
        data-duration="5.2"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
        data-layout-allow-overlap
      ></div>
      <div
        id="el-promo-cta"
        data-composition-id="promo-cta"
        data-composition-src="compositions/promo-cta.html"
        data-start="8.6"
        data-duration="3.4"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
        data-layout-allow-overlap
      ></div>

      <!-- Captions use voice timing, not scene boundaries. -->
      <section id="promo-caption-1" class="clip caption" data-start="0.35" data-duration="3.05" data-track-index="20">
        从一个想法，到完整视频，不该被重复操作拖慢。
      </section>
      <section id="promo-caption-2" class="clip caption" data-start="4.05" data-duration="4.15" data-track-index="20">
        AI-Remotion 把脚本、配音、画面和字幕接成可复核的生产线。
      </section>
      <section id="promo-caption-3" class="clip caption" data-start="9.0" data-duration="2.45" data-track-index="20">
        保留创作者控制权，稳定交付每一版成片。
      </section>

      <div class="progress-shell"><div id="promo-progress"></div></div>
    </main>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#el-promo-problem", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 0)
        .to("#el-promo-problem", { xPercent: -18, opacity: 0.48, duration: 0.4, ease: "power2.inOut" }, 3.8)
        .fromTo("#el-promo-feature", { xPercent: 100 }, { xPercent: 0, duration: 0.4, ease: "power3.out" }, 3.8)
        .to("#el-promo-feature", { scale: 1.06, opacity: 0.42, duration: 0.4, ease: "power2.inOut" }, 8.6)
        .fromTo("#el-promo-cta", { scale: 0.82, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" }, 8.6)
        .to("#promo-progress", { width: "100%", duration: 12, ease: "none" }, 0);
      window.__timelines["product-promo-template"] = tl;
    </script>
  </body>
</html>
