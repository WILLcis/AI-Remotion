aspect_ratio: 16:9
audience: 想了解 Remotion 是什么的普通人和初学者
duration_seconds: 30
must_avoid:
  - 不要把 AI 生成内容描述为已经人工核实的事实
  - 不要说 Remotion 是无代码剪辑软件
  - 不要承诺云渲染、自动发布或默认 TTS 已启用
must_include:
  - Remotion 是用 React 写代码来生成视频的框架，不是剪辑软件
  - 核心思路：组件即画面、帧由时间驱动、可程序化批量产出
  - 对普通人意味着什么：把做视频变成写代码或改参数，可复用、可版本管理
platform: B站
source_notes:
  - 讲解对象是 Remotion 框架本身，不展开 AI-Remotion 工具链
  - 面向普通人和初学者，避免堆砌 React/编程术语
tone: 清楚、自然、不装专家
topic: 普通人怎么理解 Remotion
visual_style: 深色背景、信息卡片、轻量动效
voice: 亲切自然的中文旁白
